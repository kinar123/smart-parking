name: Parking Lite CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code # קבלת הקוד מה repo
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry # התחברות ל-GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Storage Image # בניית image של ה-storage
        uses: docker/build-push-action@v4
        with:
          context: ./storage
          push: true
          tags: ghcr.io/${{ github.repository }}/storage-server:latest

      - name: Build and Push Web Image # בניית image של האתר
        uses: docker/build-push-action@v4
        with:
          context: ./web
          push: true
          tags: ghcr.io/${{ github.repository }}/web-server:latest